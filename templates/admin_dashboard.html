<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>QRESERVE | Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<div class="auth-background"></div>

<div class="auth-overlay"></div>


<!-- Navbar -->

<nav class="navbar navbar-dark custom-navbar">

    <div class="container-fluid">

        <span class="navbar-brand fw-bold">

            <i class="bi bi-shield-lock me-2"></i>

            QRESERVE ADMIN

        </span>


        <a
            href="{{ url_for('auth.admin_logout') }}"
            class="btn btn-light rounded-pill">

            <i class="bi bi-box-arrow-right me-1"></i>

            Logout

        </a>

    </div>

</nav>


<!-- Dashboard -->

<div class="container">

    <div
        class="d-flex justify-content-center align-items-center"
        style="min-height: calc(100vh - 75px);">

        <div
            class="card login-card text-center p-4"
            style="max-width: 600px;">

            <div class="card-body">

                <i
                    class="bi bi-shield-check"
                    style="font-size: 4rem; color: #b40000;">
                </i>

                <h1 class="mt-3">

                    Welcome, Administrator

                </h1>

                <p class="text-muted">

                    You have successfully logged into
                    the QRESERVE Administrator Panel.

                </p>

                <hr>

                <p class="mb-0">

                    Logged in as:

                    <strong>
                        {{ session.get("admin_email") }}
                    </strong>

                </p>

            </div>

        </div>

    </div>

</div>

</body>

</html>
