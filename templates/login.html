<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QRESERVE | Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body><div class="col-xl-4 col-lg-5 col-md-6 col-sm-8 col-11"></div>

<!-- =======================
     Background Overlay
======================== -->
<div class="background-image"></div>
<div class="overlay"></div>

<!-- =======================
     Navigation Bar
======================== -->
<nav class="navbar navbar-dark navbar-expand-lg custom-navbar">

    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center" href="#">

            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 class="logo"
                 alt="BulSU Logo">

            <div class="ms-3">

                <h6 class="mb-0 fw-bold">
                    BULACAN STATE UNIVERSITY
                </h6>

                <small>BUSTOS CAMPUS</small>

            </div>

        </a>

    </div>

</nav>

<!-- =======================
     Main Section
======================== -->

<div class="container-fluid h-100">

    <div class="row justify-content-center align-items-center login-page h-100">

        <div class="col-12">

            <!-- Title -->

            <h1 class="text-center login-title mb-4">
                QRESERVE LOGIN
            </h1>

            <!-- Login Card -->

            <div class="card login-card">

                <div class="card-body px-4 py-3">

                    <!-- Bootstrap Alert -->

                    <div id="alertBox"></div>

                    <!-- Login Form -->

                    <form id="loginForm">

                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                    type="email"
                                    class="form-control rounded-pill"
                                    id="email"
                                    placeholder="Enter your email"
                                    required>

                        </div>

                        <!-- Password -->

                        <div class="mb-2">

                            <label class="form-label">

                                Password

                            </label>

                            <div class="input-group">

                                <input
                                        type="password"
                                        class="form-control rounded-start-pill"
                                        id="password"
                                        placeholder="Enter your password"
                                        required>

                                <button
                                        class="btn btn-light rounded-end-pill"
                                        type="button"
                                        id="togglePassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>

                        <!-- Forgot Password -->

                        <div class="text-end mb-3">

                            <a href="#"
                               class="forgot-link text-decoration-none">

                                Forgot Password?

                            </a>

                        </div>

                        <!-- Login Button -->

                        <div class="d-grid mb-3">

                            <button
                                    class="btn btn-success rounded-pill"
                                    id="loginBtn">

                                <span
                                        class="spinner-border spinner-border-sm me-2 d-none"
                                        id="spinner">

                                </span>

                                LOGIN

                            </button>

                        </div>

<!-- OR Divider -->

<div class="divider">
    <span>OR</span>
</div>

<!-- Guest Button -->

<div class="d-grid mb-3">

<a href="/guest"
   class="btn btn-outline-danger rounded-pill">

    <i class="bi bi-person"></i>

    <span>CONTINUE AS GUEST</span>

</a>
</div>

<!-- Admin Button -->

<div class="d-grid mb-4">

   <a href="/admin/login"
   class="btn admin-btn rounded-pill">

    <i class="bi bi-shield-lock"></i>

    <span>ADMINISTRATOR LOGIN</span>

</a>

</div>

<!-- Sign Up -->

<div class="text-center">

    <span class="signup-text">

        Don't have an account?

    </span>

    <a href="/signup"
       class="signup-link text-decoration-none">

        Sign Up

    </a>

</div>
                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
