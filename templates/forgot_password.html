<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QRESERVE | Account Recovery</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <style>

        /* =========================================
           GENERAL
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            position: relative;
            background: #ffffff;
        }


        /* =========================================
           BACKGROUND
        ========================================= */

        .background-image {
            position: fixed;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;

            background-image: url("{{ url_for('static', filename='images/bulsu.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(3px);

            z-index: -2;
        }

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(255, 255, 255, 0.58);

            z-index: -1;
        }


        /* =========================================
           TOP NAVIGATION
        ========================================= */

        .custom-navbar {
            height: 72px;

            background: #a90000;

            border-bottom: 4px solid #e00000;

            padding: 0 28px;

            position: relative;
            z-index: 10;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .navbar-brand {
            color: white !important;
            text-decoration: none;
        }

        .logo {
            width: 48px;
            height: 48px;

            object-fit: contain;

            flex-shrink: 0;
        }

        .navbar-brand h6 {
            font-size: 15px;
            letter-spacing: 0.2px;
            line-height: 1.2;
        }

        .navbar-brand small {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }


        /* =========================================
           MAIN RECOVERY AREA
        ========================================= */

        .recovery-page {
            min-height: calc(100vh - 72px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 20px 45px;
        }


        /* =========================================
           TITLE
        ========================================= */

        .recovery-title {
            color: #a90000;

            font-size: 32px;
            font-weight: 800;

            text-align: center;

            margin: 0 0 18px;

            letter-spacing: 0.3px;
        }


        /* =========================================
           RECOVERY CARD
        ========================================= */

        .recovery-card {
            width: 100%;
            max-width: 430px;

            background: rgba(255, 255, 255, 0.96);

            border: none;

            border-radius: 26px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.18);

            padding: 28px 28px 25px;

            margin: 0 auto;

            text-align: center;
        }


        /* =========================================
           FORM LABELS
        ========================================= */

        .form-label {
            font-size: 14px;

            font-weight: 600;

            color: #222;

            margin-bottom: 7px;

            text-align: left;
            display: block;
        }


        /* =========================================
           INPUTS
        ========================================= */

        .form-control {
            height: 46px;

            border: 1px solid #d8d8d8;

            border-radius: 25px;

            padding: 0 18px;

            font-size: 14px;

            box-shadow: none;

            transition: 0.2s ease;
        }

        .form-control:focus {
            border-color: #c90000;

            box-shadow:
                0 0 0 3px rgba(201, 0, 0, 0.08);
        }

        .form-control::placeholder {
            color: #999;
        }


        /* =========================================
           SEND CODE BUTTON
        ========================================= */

        .recovery-btn {
            width: 100%;

            height: 46px;

            border: none;

            border-radius: 25px;

            background: #d00000;

            color: white;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 0.3px;

            box-shadow:
                0 8px 20px rgba(208, 0, 0, 0.25);

            transition: all 0.2s ease;
        }

        .recovery-btn:hover {
            background: #b80000;

            transform: translateY(-1px);

            color: white;
        }

        .recovery-btn:active {
            transform: translateY(0);
        }


        /* =========================================
           DIVIDER / OTHER WAYS
        ========================================= */

        .other-ways {
            margin-top: 20px;

            color: #999;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.3px;
        }

        .back-login {
            margin-top: 6px;

            font-size: 13px;
        }

        .back-login a {
            color: #006cff;

            font-weight: 600;

            text-decoration: none;
        }

        .back-login a:hover {
            text-decoration: underline;
        }


        /* =========================================
           ALERT
        ========================================= */

        #alertBox {
            margin-bottom: 12px;

            text-align: left;
        }

        #alertBox .alert {
            border-radius: 12px;

            font-size: 13px;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 576px) {

            .custom-navbar {
                height: 64px;

                padding: 0 16px;
            }

            .logo {
                width: 42px;
                height: 42px;
            }

            .navbar-brand h6 {
                font-size: 12px;
            }

            .navbar-brand small {
                font-size: 10px;
            }

            .recovery-page {
                min-height: calc(100vh - 64px);

                padding: 25px 14px 35px;
            }

            .recovery-title {
                font-size: 26px;

                margin-bottom: 14px;
            }

            .recovery-card {
                max-width: 100%;

                padding: 24px 20px 22px;

                border-radius: 22px;
            }

        }


        /* =========================================
           VERY SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            .custom-navbar {
                padding: 0 12px;
            }

            .logo {
                width: 38px;
                height: 38px;
            }

            .navbar-brand h6 {
                font-size: 11px;
            }

            .navbar-brand small {
                font-size: 9px;
            }

            .recovery-page {
                padding: 20px 10px 30px;
            }

            .recovery-title {
                font-size: 23px;
            }

            .recovery-card {
                padding: 21px 17px 20px;
            }

        }

        /* =========================================================
           FORCE UNIVERSITY HEADER SIZE (large screens only)
           ========================================================= */

        @media (min-width: 577px) {

            .custom-navbar {
                height: 82px !important;
                padding: 0 32px !important;
            }

            .custom-navbar .logo {
                width: 62px !important;
                height: 62px !important;
                object-fit: contain !important;
                flex-shrink: 0 !important;
            }

            .custom-navbar .navbar-brand h6 {
                font-size: 17px !important;
                font-weight: 700 !important;
                line-height: 1.15 !important;
                margin: 0 !important;
            }

            .custom-navbar .navbar-brand small {
                font-size: 13px !important;
                font-weight: 600 !important;
                letter-spacing: 0.5px !important;
            }
        }

        .navbar-brand {
            min-width: 0;
        }

        .navbar-brand > div {
            min-width: 0;
        }

        .navbar-brand h6,
        .navbar-brand small {
            white-space: normal;
            overflow-wrap: break-word;
        }

    </style>

</head>


<body>

    <!-- =========================================
         BACKGROUND
    ========================================= -->

    <div class="background-image"></div>
    <div class="overlay"></div>


    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav class="navbar custom-navbar">

        <div class="container-fluid p-0">

            <a
                class="navbar-brand d-flex align-items-center"
                href="{{ url_for('auth.login') }}"
            >

                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    class="logo"
                    alt="Bulacan State University Logo"
                >

                <div class="ms-3">

                    <h6 class="mb-0 fw-bold">
                        BULACAN STATE UNIVERSITY
                    </h6>

                    <small>
                        BUSTOS CAMPUS
                    </small>

                </div>

            </a>

        </div>

    </nav>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="recovery-page">

        <div style="width: 100%; max-width: 430px;">

            <!-- TITLE -->

            <h1 class="recovery-title">
                ACCOUNT RECOVERY
            </h1>


            <!-- =====================================
                 RECOVERY CARD
            ====================================== -->

            <div class="recovery-card">


                <!-- FLASH MESSAGES -->

                <div id="alertBox">

                    {% with messages = get_flashed_messages(with_categories=true) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div
                                    class="alert alert-{{ category }} alert-dismissible fade show"
                                    role="alert"
                                >

                                    {{ message }}

                                    <button
                                        type="button"
                                        class="btn-close"
                                        data-bs-dismiss="alert"
                                    ></button>

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}

                </div>


                <!-- FORGOT PASSWORD FORM -->

                <form
                    method="POST"
                    action="{{ url_for('auth.forgot_password') }}"
                >

                    <!-- EMAIL -->

                    <div class="mb-4 text-start">

                        <label
                            for="email"
                            class="form-label"
                        >
                            EMAIL
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="2024200791@ms.bulsu.edu.ph"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- SEND CODE BUTTON -->

                    <button
                        type="submit"
                        class="recovery-btn"
                    >

                        SEND CODE

                    </button>

                </form>


                <!-- OTHER WAYS -->

                <div class="other-ways">
                    Use other ways
                </div>

                <div class="back-login">

                    <a
                        href="{{ url_for('auth.login') }}"
                    >
                        Back to login
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================================
         BOOTSTRAP
    ========================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
