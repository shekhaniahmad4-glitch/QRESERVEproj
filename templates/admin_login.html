<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>QRESERVE | Administrator Login</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">


    <!-- Poppins -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <style>

        /* =========================================
           GENERAL
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            position: relative;
        }


        /* =========================================
           BACKGROUND
        ========================================= */

        .background-image {
            position: fixed;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;

            background-image: url("{{ url_for('static', filename='images/bulsu.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(3px);

            z-index: -2;
        }

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(255, 255, 255, 0.58);

            z-index: -1;
        }


        /* =========================================
           NAVBAR
        ========================================= */

        .custom-navbar {
            height: 72px;

            background: #a90000;

            border-bottom: 4px solid #e00000;

            padding: 0 28px;

            position: relative;
            z-index: 10;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .navbar-brand {
            color: white !important;
            text-decoration: none;
        }

        .logo {
            width: 48px;
            height: 48px;

            object-fit: contain;
        }

        .navbar-brand h6 {
            font-size: 15px;
            letter-spacing: 0.2px;
        }

        .navbar-brand small {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }


        /* =========================================
           ADMIN AREA
        ========================================= */

        .admin-page {
            min-height: calc(100vh - 72px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 20px 45px;
        }


        /* =========================================
           TITLE
        ========================================= */

        .admin-title {
            color: #a90000;

            font-size: 32px;
            font-weight: 800;

            text-align: center;

            margin: 0 0 18px;

            letter-spacing: 0.3px;
        }


        /* =========================================
           CARD
        ========================================= */

        .admin-card {
            width: 100%;
            max-width: 430px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 26px;

            padding: 28px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.18);

            margin: 0 auto;
        }


        /* =========================================
           ICON
        ========================================= */

        .admin-icon {
            text-align: center;

            color: #a90000;

            font-size: 42px;

            margin-bottom: 5px;
        }

        .admin-description {
            text-align: center;

            color: #777;

            font-size: 13px;

            margin-bottom: 22px;
        }


        /* =========================================
           LABEL
        ========================================= */

        .form-label {
            font-size: 14px;

            font-weight: 600;

            color: #222;

            margin-bottom: 7px;
        }


        /* =========================================
           INPUT
        ========================================= */

        .form-control {
            height: 46px;

            border: 1px solid #d8d8d8;

            border-radius: 25px;

            padding: 0 18px;

            font-size: 14px;

            box-shadow: none;
        }

        .form-control:focus {
            border-color: #c90000;

            box-shadow:
                0 0 0 3px rgba(201, 0, 0, 0.08);
        }


        /* =========================================
           PASSWORD
        ========================================= */

        .input-group {
            height: 46px;
        }

        .input-group .form-control {
            height: 46px;
        }

        .input-group .btn {
            width: 48px;

            border: 1px solid #d8d8d8;
            border-left: none;

            background: white;

            color: #777;
        }

        .input-group .btn:hover {
            color: #a90000;
        }


        /* =========================================
           ADMIN BUTTON
        ========================================= */

        .admin-login-button {
            height: 46px;

            background: #d00000;

            border: none;

            color: white;

            font-size: 14px;

            font-weight: 700;

            box-shadow:
                0 8px 20px rgba(208, 0, 0, 0.20);
        }

        .admin-login-button:hover {
            background: #b80000;

            color: white;

            transform: translateY(-1px);
        }


        /* =========================================
           BACK TO LOGIN
        ========================================= */

        .back-login {
            text-align: center;
        }

        .back-login a {
            color: #006cff;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;
        }

        .back-login a:hover {
            text-decoration: underline;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 576px) {

            .custom-navbar {
                height: 64px;

                padding: 0 16px;
            }

            .logo {
                width: 42px;
                height: 42px;
            }

            .navbar-brand h6 {
                font-size: 12px;
            }

            .navbar-brand small {
                font-size: 10px;
            }

            .admin-page {
                min-height: calc(100vh - 64px);

                padding: 25px 14px 35px;
            }

            .admin-title {
                font-size: 26px;

                margin-bottom: 14px;
            }

            .admin-card {
                max-width: 100%;

                padding: 24px 20px 22px;

                border-radius: 22px;
            }

        }


        /* =========================================
           VERY SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            .admin-page {
                padding: 20px 10px 30px;
            }

            .admin-title {
                font-size: 23px;
            }

            .admin-card {
                padding: 21px 17px 20px;
            }

        }
/* =========================================================
   FORCE UNIVERSITY HEADER SIZE (large screens only)
   NOTE: scoped to min-width so it no longer overrides the
   mobile breakpoints above on small phones/tablets.
   ========================================================= */

@media (min-width: 577px) {

    .custom-navbar {
        height: 82px !important;
        padding: 0 32px !important;
    }

    .custom-navbar .logo {
        width: 62px !important;
        height: 62px !important;
        object-fit: contain !important;
        flex-shrink: 0 !important;
    }

    .custom-navbar .navbar-brand h6 {
        font-size: 17px !important;
        font-weight: 700 !important;
        line-height: 1.15 !important;
        margin: 0 !important;
    }

    .custom-navbar .navbar-brand small {
        font-size: 13px !important;
        font-weight: 600 !important;
        letter-spacing: 0.5px !important;
    }
}

.navbar-brand {
    min-width: 0;
}

.navbar-brand > div {
    min-width: 0;
}

.navbar-brand h6,
.navbar-brand small {
    white-space: normal;
    overflow-wrap: break-word;
}
    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background-image"></div>

    <div class="overlay"></div>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar custom-navbar">

        <div class="container-fluid p-0">

            <a
                class="navbar-brand d-flex align-items-center"
                href="{{ url_for('auth.login') }}">

                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    class="logo"
                    alt="Bulacan State University Logo">

                <div class="ms-3">

                    <h6 class="mb-0 fw-bold">
                        BULACAN STATE UNIVERSITY
                    </h6>

                    <small>
                        BUSTOS CAMPUS
                    </small>

                </div>

            </a>

        </div>

    </nav>


    <!-- =========================================
         ADMIN LOGIN
    ========================================= -->

    <main class="admin-page">

        <div style="width: 100%; max-width: 430px;">

            <h1 class="admin-title">
                ADMINISTRATOR LOGIN
            </h1>


            <div class="admin-card">


                <!-- ICON -->

                <div class="admin-icon">

                    <i class="bi bi-shield-lock-fill"></i>

                </div>


                <p class="admin-description">
                    Administrator access only
                </p>


                <!-- FLASH MESSAGES -->

                {% with messages = get_flashed_messages(with_categories=true) %}

                    {% if messages %}

                        {% for category, message in messages %}

                            <div
                                class="alert alert-{{ category }} rounded-4 text-center">

                                {{ message }}

                            </div>

                        {% endfor %}

                    {% endif %}

                {% endwith %}


                <!-- FORM -->

                <form
                    method="POST"
                    action="{{ url_for('auth.admin_login') }}">


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label">

                            Administrator Email

                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter administrator email"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label
                            for="adminPassword"
                            class="form-label">

                            Password

                        </label>


                        <div class="input-group">

                            <input
                                type="password"
                                class="form-control rounded-start-pill"
                                id="adminPassword"
                                name="password"
                                placeholder="Enter your password"
                                required>

                            <button
                                type="button"
                                class="btn rounded-end-pill"
                                id="toggleAdminPassword">

                                <i
                                    class="bi bi-eye"
                                    id="adminEyeIcon">
                                </i>

                            </button>

                        </div>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <div class="d-grid mt-4">

                        <button
                            type="submit"
                            class="btn admin-login-button rounded-pill">

                            <i class="bi bi-box-arrow-in-right me-2"></i>

                            ADMIN LOGIN

                        </button>

                    </div>


                    <!-- BACK -->

                    <div class="back-login mt-4">

                        <a
                            href="{{ url_for('auth.login') }}">

                            <i class="bi bi-arrow-left me-1"></i>

                            Back to Login

                        </a>

                    </div>


                </form>

            </div>

        </div>

    </main>


    <!-- =========================================
         BOOTSTRAP
    ========================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =========================================
         ADMIN PASSWORD TOGGLE
    ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const password =
                    document.getElementById("adminPassword");

                const toggle =
                    document.getElementById(
                        "toggleAdminPassword"
                    );

                const icon =
                    document.getElementById(
                        "adminEyeIcon"
                    );


                toggle.addEventListener(
                    "click",
                    function () {

                        if (
                            password.type === "password"
                        ) {

                            password.type = "text";

                            icon.classList.remove(
                                "bi-eye"
                            );

                            icon.classList.add(
                                "bi-eye-slash"
                            );

                        } else {

                            password.type = "password";

                            icon.classList.remove(
                                "bi-eye-slash"
                            );

                            icon.classList.add(
                                "bi-eye"
                            );

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
